<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- Forge app icon — geometric "F" monogram, built from rects to match the app's
       hand-drawn/stroke-based icon language (see components/Icon.jsx). Dark near-black
       ground with the app's orange accent (ACCENTS.orange in lib/format.js), for a
       minimal/premium mark that reads clearly down to a small home-screen size.
       App-icon source == the PWA icon (public/icon-512.png), geometry traced 1:1 so the
       native app, the home-screen PWA and the website favicon all show the same icon.
       Generate platform icons + splash via `npx @capacitor/assets generate` — docs/MOBILE.md. -->
  <rect width="512" height="512" fill="#0c0e12"/>
  <g fill="#ff9f0a">
    <rect x="176" y="144" width="52" height="224"/>
    <rect x="176" y="144" width="160" height="52"/>
    <rect x="176" y="256" width="124" height="52"/>
  </g>
</svg>
